[package]
name = "x402-upto-settlement"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "x402 `upto` scheme settlement contract for Stellar/Soroban (x402UptoStellarSettlement)"
repository = "https://github.com/mohamedFrihat/x402-stellar-facilitator"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "27.0.5"

[dev-dependencies]
soroban-sdk = { version = "27.0.5", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
