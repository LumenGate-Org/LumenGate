[package]
name = "x402-spending-policy-account"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Reference Soroban custom __check_auth account enforcing a real per-period spending ceiling on a single SEP-41 asset, proving Stellar smart-account spending-policy composability with this project's exact/upto schemes live, not just architecturally"
repository = "https://github.com/LumenGate-Org/LumenGate"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "27.0.5"

[dev-dependencies]
soroban-sdk = { version = "27.0.5", features = ["testutils"] }
# Signs real Ed25519 messages in tests so `__check_auth`'s budget logic can
# be exercised past a genuinely valid signature, not just its failure path
# (mirroring contracts/custom-account-demo, whose only test needs the
# opposite: a deliberately invalid signature) — already present transitively
# via soroban-sdk's own testutils, pinned here directly since this crate
# calls it by name.
ed25519-dalek = "2.2.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
